[tool.poetry]
name = "buildflow-tps"
version = "0.1.0"
description = "TPS — Tender Preparation & Submission API"
authors = ["Novamerx <team@novamerx.com>"]
packages = [{ include = "api" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
pydantic = ">=2.7.0"
pydantic-settings = ">=2.0.0"
asyncpg = ">=0.29.0"
httpx = ">=0.27.0"
python-dotenv = ">=1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
