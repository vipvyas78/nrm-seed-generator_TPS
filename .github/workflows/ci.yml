# CI - typecheck, unit tests and e2e for both Node packages.
#
# Tests live under tests/unit (no DB, no browser), tests/integration (needs a live
# DATABASE_URL) and, for the web package, tests/e2e (Playwright) - never in src/, which
# holds production code only (issue #48's test relocation). The bff and web jobs below run
# `pnpm … test`, which runs unit AND integration together; every *.integration.test.ts
# guards on DATABASE_URL and self-skips when it is absent, so what actually executes here
# is the unit suites alone - a real gate that needs no infrastructure, with the integration
# skips still visible in the output rather than hidden by a separate invocation. There is no
# Python job: api/ has no tests and the repo carries no ruff or mypy configuration.
#
# Among the unit suites, two are contracts rather than ordinary tests and are worth knowing
# about before deleting anything that looks redundant:
#
#   inboundEmail.test.ts   asserts fixed signature vectors shared byte-identically with the
#                          novamerx-comms-worker repository. That repository signs with
#                          WebCrypto and this one verifies with node:crypto; the vectors are
#                          the only thing stopping the two drifting, and they work precisely
#                          because the expectation is an absolute constant.
#   commsBoundary.test.ts  asserts commsDb.ts is still the only non-test file querying a
#                          `comms.` table. That schema's DDL lives in the other repository,
#                          so the blast radius of a change there is however many files here
#                          name it.
#
# The web-e2e job needs neither Postgres nor the BFF running - playwright.config.ts's own
# header explains why: every /api/** call is fulfilled by page.route from a fixture in each
# spec, so the whole suite is exercising the page's own behaviour, not a database.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bff:
    name: BFF typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — action-setup reads packageManager (pnpm@10.18.0) from
      # package.json, so the pinned version cannot drift away from the lockfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @tps/bff typecheck

      - name: Unit tests
        run: pnpm --filter @tps/bff test -- --reporter=verbose

  web:
    name: Web typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @tps/web typecheck

      - name: Unit tests
        run: pnpm --filter @tps/web test -- --reporter=verbose

  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @tps/web exec playwright install --with-deps chromium

      - name: e2e tests
        run: pnpm --filter @tps/web test:e2e
