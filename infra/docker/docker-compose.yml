services:
  # Shared PostgreSQL — same instance as nrm-seed-generator.
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   environment: { POSTGRES_USER: buildflow, POSTGRES_PASSWORD: buildflow, POSTGRES_DB: buildflow }
  #   ports: ["5433:5432"]
  #   volumes: [postgres_data:/var/lib/postgresql/data]

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bff
    command: ["node", "dist/migrate.js"]
    working_dir: /app/apps/bff
    environment:
      DATABASE_URL: postgresql://buildflow:buildflow@postgres:5432/buildflow
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-tps-dev-token-key-32-chars-min}
      AUTH_DISABLED: "true"
    depends_on:
      - postgres
    networks:
      - buildflow

  bff:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bff
    command: ["node", "dist/server.js"]
    working_dir: /app/apps/bff
    ports:
      - "3200:3200"
    environment:
      NODE_ENV: production
      PORT: "3200"
      DATABASE_URL: postgresql://buildflow:buildflow@postgres:5432/buildflow
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5175}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-tps-dev-token-key-32-chars-min}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      SCMS_BFF_URL: ${SCMS_BFF_URL:-http://scms-bff:3100}
      LOG_LEVEL: info
    depends_on:
      - migrate
    networks:
      - buildflow

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5175:8080"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3200}
      VITE_MAIN_APP_URL: ${VITE_MAIN_APP_URL:-http://localhost:5173}
    networks:
      - buildflow

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8200:8200"
    environment:
      DATABASE_URL: postgresql://buildflow:buildflow@postgres:5432/buildflow
    networks:
      - buildflow

networks:
  buildflow:
    external: true
    name: nrm-seed-generator_buildflow
