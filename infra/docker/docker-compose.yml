# Explicit project name. Without this, Compose derives it from this file's parent
# directory ("docker"), which is the same name the parent platform derives — and a
# `docker compose down -v` here would then destroy the parent's database volume.
name: tps

# PostgreSQL is owned solely by the parent platform (nrm-seed-generator). TPS shares
# that instance and keeps its own objects in the `tps` schema. Start the parent first.
services:
  migrate-tps:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bff
    command: ["node", "dist/migrate.js"]
    working_dir: /app/apps/bff
    environment:
      DATABASE_URL: postgresql://buildflow:buildflow@postgres:5432/buildflow
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-tps}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-tps-dev-token-key-32-chars-min}
      AUTH_DISABLED: "true"
    # The parent owns postgres, so a `depends_on` condition cannot reach it across
    # compose projects; retry instead until it accepts connections.
    restart: on-failure
    networks:
      - parent

  bff-tps:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bff
    command: ["node", "dist/server.js"]
    working_dir: /app/apps/bff
    ports:
      - "3200:3200"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3200"
      DATABASE_URL: postgresql://buildflow:buildflow@postgres:5432/buildflow
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-tps}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5175}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-tps-dev-token-key-32-chars-min}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      # TPS reads the SCMS module's schema directly for Step 4 shortlist candidates —
      # same database, no HTTP hop to bff-scms.
      SCMS_SCHEMA: ${SCMS_SCHEMA:-scms}
      LOG_LEVEL: info
    depends_on:
      - migrate-tps
    networks:
      - parent

  # Consumes buildflow_takeoff_completion_queue and launches tender preparation. Its own
  # process rather than a thread inside bff-tps, so the API does not gain a Redis
  # dependency at boot and the two restart independently. No `networks` change is needed:
  # this stack already joins the parent's network, where `redis` is the parent's own.
  worker-tps:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bff
    command: ["node", "dist/worker.js"]
    working_dir: /app/apps/bff
    environment:
      DATABASE_URL: postgresql://buildflow:buildflow@postgres:5432/buildflow
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-tps}
      SCMS_SCHEMA: ${SCMS_SCHEMA:-scms}
      # Hardcoded, not `${REDIS_URL:-...}`, for the same reason DATABASE_URL above is:
      # .env holds the HOST value (redis://localhost:6379), and interpolating it here
      # points the container at itself. BullMQ retries a dead connection silently, so the
      # symptom is a worker that starts, logs nothing, and consumes nothing.
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      - migrate-tps
    # The parent owns redis, so a depends_on condition cannot reach it across compose
    # projects; retry until it accepts connections.
    restart: on-failure
    networks:
      - parent

  web-tps:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Build args, not `environment`: Vite bakes these into the bundle at build time, so
        # runtime env vars would be silently ignored. Changing any of them needs `--build`.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3200}
        VITE_MAIN_APP_URL: ${VITE_MAIN_APP_URL:-http://localhost:5173}
        # Must match the parent platform's dev identity, or provisionActor mints a second
        # organization and every take-off-launched workflow is filtered out of view.
        VITE_DEV_SUBJECT: ${VITE_DEV_SUBJECT:-local-user}
        VITE_DEV_ORGANIZATION: ${VITE_DEV_ORGANIZATION:-local-org}
        VITE_DEV_EMAIL: ${VITE_DEV_EMAIL:-dev@example.com}
    ports:
      - "5175:8080"
    networks:
      - parent

  api-tps:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8200:8200"
    environment:
      DATABASE_URL: postgresql://buildflow:buildflow@postgres:5432/buildflow
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-tps}
    networks:
      - parent

networks:
  # The parent platform's network, joined by name. The parent's postgres carries the
  # DNS alias `postgres` on it.
  parent:
    external: true
    name: ${PARENT_NETWORK:-buildflow}
