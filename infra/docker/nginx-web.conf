server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output. Two things matter here, and the SPA fallback below gets both
    # wrong if this block is missing:
    #
    #  - `=404`, not the fallback. A request for a bundle that no longer exists must fail
    #    as a 404. Under the catch-all it returned index.html as text/html with a 200, so
    #    a browser holding a stale index.html asked for the previous hash, got HTML where
    #    it expected a module, and the app died on a parse error with a blank page — which
    #    looks exactly like the site being down.
    #  - immutable. The filename already carries a content hash, so the bytes can never
    #    change under it; re-validating them on every load is pure latency.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached: it is the only file whose name is stable and whose
    # contents change on every deploy, since it names the current hashed bundle. A cached
    # copy pins the browser to a build that no longer exists on the server.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA routes (/packages/:id/tender-prep and friends) have no file behind them, so they
    # fall back to the app shell and React Router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same SPA, mounted a second time under /tps/ so the one build also serves the
    # tunnel-forwarded public path (dev.novamerx.ai/tps) without touching root behaviour —
    # Cloudflare Tunnel path rules forward the literal path unrewritten, so this origin has
    # to understand the /tps prefix natively. `alias` (not `root`) strips the matched
    # prefix so /tps/assets/x.js still resolves to the same physical assets/x.js file.
    location /tps/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /tps/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /tps/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /tps/index.html;
    }

    # Hoisted to the server block so all three /tps-api/ locations below inherit them.
    # nginx does not share directives between sibling locations, and three copies of this
    # block is three chances for one of them to drift.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # UPLOADS: nginx's client_max_body_size defaults to 1m, and it applies to every request
    # proxied through here. Two routes accept bodies far larger than that, and both were
    # silently capped at 1MB until these blocks existed:
    #
    #   - a subcontractor attaching a drawing to a query (app limit 12MB), which failed
    #     with an nginx HTML 413 the app could not explain;
    #   - an inbound email forwarded by novamerx-comms-worker (app limit 20MB), whose
    #     worker would have dutifully re-posted every message truncated, dropping real
    #     attachments while still returning 202.
    #
    # Each limit here sits ABOVE the application's own, deliberately: the 413 a caller sees
    # should come from Fastify with a JSON body naming the rule, never from nginx with HTML.
    # Declared per-route rather than on the server block so every OTHER API call keeps the
    # tight default — an unbounded body is still refused everywhere it is not expected.

    location = /tps-api/internal/email/inbound {
        client_max_body_size 25m;
        proxy_pass http://bff-tps:3200/internal/email/inbound;
    }

    # The whole portal namespace, not just .../rfi: a prefix match needs no regex (a regex
    # location cannot carry a URI on proxy_pass), and the routes that take no body are
    # still bounded by their own per-route bodyLimit in the app.
    location /tps-api/portal/ {
        client_max_body_size 15m;
        proxy_pass http://bff-tps:3200/portal/;
    }

    # bff-tps's own routes are unprefixed; proxy_pass's trailing slash strips /tps-api/
    # before forwarding, so bff-tps needs zero code changes and keeps working unprefixed
    # on :3200 directly too.
    location /tps-api/ {
        proxy_pass http://bff-tps:3200/;
    }
}
